# ==========================================================
# School CyberWatch - Backend configuration
# ==========================================================
# Values are read from environment variables when present.
# For local development, copy env.example.properties over
# these values or set the variables in your IDE/terminal.
# NEVER commit real passwords to source control.
# ==========================================================

# Server Configuration
server.port=8080

# MySQL Database Configuration
# Local dev password comes from the environment (DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/School_Cyber_Watch}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Configuration
# Automatically creates or updates the database schema based on our Java Entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Open API views for debugging (harmless in a university prototype)
spring.jpa.open-in-view=false
server.error.include-message=always

# ----------------------------------------------------------
# Authentication (JWT) - change the secret via env var in
# any shared/demo environment. Default is dev-only.
# ----------------------------------------------------------
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
# Token validity in minutes (8 hours)
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Bootstrap admin account (created on first startup if absent)
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@school.edu.rw}
app.bootstrap.admin-password=${ADMIN_PASSWORD:Admin@123}

# ----------------------------------------------------------
# Wazuh Manager API (keep credentials backend-side only!)
# Wazuh 4.x manager API: https://<manager>:55000
# ----------------------------------------------------------
wazuh.api.base-url=${WAZUH_API_URL:https://192.168.56.101:55000}
wazuh.api.username=${WAZUH_API_USERNAME:wazuh-wui}
wazuh.api.password=${WAZUH_API_PASSWORD:}
# Seconds to wait before giving up on the Wazuh API
wazuh.api.timeout-seconds=${WAZUH_API_TIMEOUT:8}

# ----------------------------------------------------------
# Wazuh Indexer (OpenSearch) - source of alert data.
# In Wazuh 4.x the manager API does NOT serve alerts; they live in the
# wazuh-alerts-* indices on the indexer (port 9200) and are read with
# HTTP Basic auth against the _search API.
# ----------------------------------------------------------
wazuh.indexer.base-url=${WAZUH_INDEXER_URL:https://192.168.56.101:9200}
wazuh.indexer.username=${WAZUH_INDEXER_USERNAME:admin}
wazuh.indexer.password=${WAZUH_INDEXER_PASSWORD:}
wazuh.indexer.timeout-seconds=${WAZUH_INDEXER_TIMEOUT:8}

# ----------------------------------------------------------
# Email notifications (Gmail App Password or SMTP relay).
# spring.mail.username = sender address
# app.notifications.recipient = ICT administrator inbox
# ----------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notifications.enabled=${MAIL_ENABLED:false}
app.notifications.recipient=${ALERT_RECIPIENT:}
