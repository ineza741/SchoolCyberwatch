# ==========================================================
# School CyberWatch - example environment variables
# ==========================================================
# Copy this file to "env.properties" (never commit it), edit
# the values, then start the backend with:
#
#   set -a; source env.properties; set +a
#   ../tools/apache-maven-3.9.9/bin/mvn spring-boot:run
#
# Or pass individual variables:
#   DB_PASSWORD=mysecret mvn spring-boot:run
# ==========================================================

# --- Database (MySQL) ---
DB_URL=jdbc:mysql://localhost:3306/School_Cyber_Watch
DB_USERNAME=root
DB_PASSWORD=your-mysql-password

# --- JWT ---
JWT_SECRET=replace-with-a-long-random-string-at-least-32-chars
JWT_EXPIRATION_MINUTES=480

# --- Bootstrap ICT administrator (created on first startup) ---
ADMIN_EMAIL=admin@school.edu.rw
ADMIN_PASSWORD=Admin@123

# --- Wazuh Manager API (agents) ---
WAZUH_API_URL=https://192.168.56.101:55000
WAZUH_API_USERNAME=wazuh-wui
WAZUH_API_PASSWORD=your-wazuh-api-password
WAZUH_API_TIMEOUT=8

# --- Wazuh Indexer / OpenSearch (alerts, port 9200) ---
WAZUH_INDEXER_URL=https://192.168.56.101:9200
WAZUH_INDEXER_USERNAME=admin
WAZUH_INDEXER_PASSWORD=your-indexer-password
WAZUH_INDEXER_TIMEOUT=8

# --- Email notifications ---
MAIL_ENABLED=true
MAIL_HOST=smtp.gmail.com
MAIL_PORT=587
MAIL_USERNAME=your.address@gmail.com
MAIL_PASSWORD=your-16-char-app-password
ALERT_RECIPIENT=ict.admin@school.edu.rw
